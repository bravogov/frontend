  roadmap:
    actions_section:
      heading: What GOV.UH is improving
      items:
      - heading: Keep government information accurate and accessible
        paragraph: Make official information easier to find and maintain across departments and public bodies.
        steps:
        - heading: Public starting points
          items:
          - text: 'The <a href="/" class="govuk-link">GOV.UH homepage</a> provides the main entry point to government information.'
          - text: 'The <a href="/government/organisations" class="govuk-link">government organisations directory</a> helps people find responsible departments and public bodies.'
          - text: 'The <a href="/help" class="govuk-link">GOV.UH help pages</a> explain how to use the website.'
        - heading: Work in progress
          items:
          - text: Restore complete topic and browse navigation, with working links from the homepage to relevant content.
          - text: Reconcile published organisation pages, ministerial information and corporate records with the competent institutional sources.
          - text: Correct site identity, accessible navigation and inconsistencies across public and staff publishing pages.
        - heading: Next improvements
          items:
          - text: Test government content pages for clear headings, related links, accessible formats and consistent layouts.
          - text: Review links and redirects after every approved publication or institutional change.
      - heading: Connect Government information with legislation and public services
        paragraph: Each description of a public function must agree with its legal authority and the service that delivers it.
        steps:
        - heading: Public starting points
          items:
          - text: 'Read <a href="/government/how-government-works" class="govuk-link">how government works</a> for an explanation of Government and its relationships with other institutions.'
          - text: 'Find the <a href="/government/organisations/cabinet-office" class="govuk-link">Cabinet Office</a> and <a href="/government/organisations/attorney-generals-office" class="govuk-link">Attorney General’s Office</a> in the organisation directory.'
          - text: 'Use <a href="https://legislation.gov.uhrblx.com/" class="govuk-link">United Hampshire legislation</a> to find legislation published by its separate statutory publication service.'
        - heading: Work in progress
          items:
          - text: Match published legislation to authenticated enacted texts, citations, commencement and territorial extent.
          - text: Connect each public service to its actual application, secure receiving process and accountable department.
          - text: Distinguish Government publications from independent parliamentary, judicial and devolved institutional records.
        - heading: Next improvements
          items:
          - text: Test complete public-to-staff journeys, including refusals, corrections and appeals where provided by law.
      - heading: Respond to users and correct errors
        paragraph: Improve information and services using reported problems and tested outcomes rather than unsupported claims of completion.
        steps:
        - heading: Public starting points
          items:
          - text: 'The <a href="/contact" class="govuk-link">GOV.UH contact page</a> gives users a starting point for identifying the relevant service or organisation.'
        - heading: Work in progress
          items:
          - text: Ensure feedback, complaints, information-rights requests and accessibility requests reach the correct receiving team.
          - text: Check that published contact routes have working staff handling, records and response arrangements.
        - heading: Next improvements
          items:
          - text: Use verified service and content defects to improve guidance, forms and the publication process.
      - heading: Make services easier to use together
        paragraph: People should be able to move from clear guidance to the correct transaction without repeating information unnecessarily.
        steps:
        - heading: Public starting points
          items:
          - text: 'Use the <a href="/government/organisations" class="govuk-link">organisation directory</a> to identify the responsible government body.'
          - text: 'Use <a href="/search/all" class="govuk-link">GOV.UH search</a> to locate available publications and guidance.'
        - heading: Work in progress
          items:
          - text: Finish identity, permissions, accessibility and secure casework connections before opening incomplete applications.
          - text: Provide accurate service eligibility, instructions, acknowledgements and progress information where a service is authorised.
        - heading: Next improvements
          items:
          - text: Test journeys across departmental and specialist websites without combining their independent legal functions.
      - heading: Publish dependable content in usable formats
        paragraph: Keep the public publication and editorial systems consistent with the decisions and records they represent.
        steps:
        - heading: Public starting points
          items:
          - text: 'Read published <a href="/government/publications" class="govuk-link">government publications</a> and <a href="/government/how-government-works" class="govuk-link">information about Government</a>.'
        - heading: Work in progress
          items:
          - text: Remove obsolete UK Government examples from live UH pages and link to verified UH information instead.
          - text: Preserve correct legal notices, document histories and accessibility information across publication formats.
        - heading: Next improvements
          items:
          - text: Verify public content against the same authoritative records used by editors and responsible institutions.
    hero:
      description: GOV.UH is the public website for the United Hampshire Government. This page describes available starting points and current work to improve content, services and navigation. A service is not open merely because a development item appears here.
      heading: GOV.UH service improvements
    page_title: Service improvements - GOV.UH
